[package]
name = "magi_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime & Web Server
tokio = { version = "1.36", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
axum = { version = "0.7.4", features = ["json", "macros"] }
tower-http = { version = "0.5.1", features = ["cors", "trace"] }

# Serialization
async-trait = "0.1.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.13"
futures = "0.3"
# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
thiserror = "1.0"
anyhow = "1.0"
config = "0.14"
walkdir = "2.5"
reqwest = { version = "0.11", features = ["json", "stream"] }
urlencoding = "2.1.3"
ndarray = "0.15"
tokio-util = { version = "0.7", features = ["codec"] }

# Inference & AI
regex = "1.12.3"
candle-core = { version = "0.10.2", features = [] }
candle-nn = { version = "0.10.2", features = [] }
candle-transformers = { version = "0.10.2" }
hf-hub = "0.5.0"
tokenizers = "0.22.2"
printpdf = "0.7"
clap = { version = "4.5", features = ["derive"] }
image = "0.24.9"
dotenvy = "0.15.7"
sysinfo = "0.30.5"

# Python Compatibility (Optional)
pyo3 = { version = "0.20", features = ["extension-module"] }
sled = "0.34.7"
bson = "2.10.0"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[lib]
name = "magi_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "magi_server"
path = "src/main.rs"

[[bin]]
name = "train_prepare"
path = "src/bin/train_prepare.rs"

[dev-dependencies]
tempfile = "3.27.0"
