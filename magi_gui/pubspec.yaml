name: magi_gui
description: A high-performance AI research terminal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path: ^1.8.3
  flutter_riverpod: ^2.4.0
  http: ^1.1.0
  flutter_markdown: ^0.6.18
  flutter_math_fork: ^0.7.2
  highlight: ^0.7.0
  pdfrx: ^1.0.64
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  json_annotation: ^4.8.1
  window_manager: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
